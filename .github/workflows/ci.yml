name: CI and deploy

# Pull requests: run every check, publish nothing.
# Pushes to main (and manual runs): run every check; only if all of them pass,
# build the site, smoke-test that exact build, publish it to GitHub Pages and
# then check the live site.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      online_check:
        description: 'After deploying, play one round online on the live site (two fresh browsers, a new room that is deleted afterwards)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  NODE_VERSION: '22'

jobs:
  checks:
    name: Tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # The Firebase emulators (database rules and SDK tests) need Java.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies from the lockfile
        run: npm ci
      - name: Cache the Firebase emulators
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium
      - name: Typecheck, lint, unit, AI, network, Firebase, build, dist check and browser tests
        run: npm run test:all
      - name: Keep the test results of a failed run
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  build-pages:
    name: Build the site
    needs: checks
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies from the lockfile
        run: npm ci
      # Public Firebase web-app settings come from repository *variables*
      # (Settings > Secrets and variables > Actions > Variables). They are not
      # secrets: every visitor's browser receives them. Without them the site
      # is still built and says that online play is not set up.
      - name: Production build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      - name: Check asset paths and contents of the build
        run: npm run check:dist
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke-test this exact build before publishing it
        run: |
          npx vite preview --port 4180 --strictPort &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4180/Blokus-Team-AI/ > /dev/null && break; sleep 1; done
          LIVE_URL=http://127.0.0.1:4180/Blokus-Team-AI/ npm run test:e2e:live
        env:
          # With Firebase variables set, the build must offer online rooms.
          EXPECT_ONLINE: ${{ vars.VITE_FIREBASE_PROJECT_ID != '' && '1' || '' }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    needs: build-pages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  verify:
    name: Check the live site
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies from the lockfile
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for the published page
        run: |
          for i in $(seq 1 30); do curl -fsS "${{ needs.deploy.outputs.page_url }}" > /dev/null && exit 0; sleep 10; done
          echo "The page did not come up in time" && exit 1
      - name: Load the live site and play offline practice in a browser
        run: npm run test:e2e:live
        env:
          LIVE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECT_ONLINE: ${{ vars.VITE_FIREBASE_PROJECT_ID != '' && '1' || '' }}
      - name: Play one round online on the live site (opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.online_check
        run: npx playwright test -c playwright.live.config.ts e2e/live/online.spec.ts
        env:
          LIVE_URL: ${{ needs.deploy.outputs.page_url }}
          LIVE_ONLINE: '1'
